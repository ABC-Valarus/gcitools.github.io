baseURL = 'https://ABC-Valarus.github.io/gcitools.github.io/'
theme = "hugo-mana"
defaultContentLanguage = "en"

[pagination]
  pageSize = 10

[markup]
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 6
    ordered = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    noClasses = false
    style = "catppuccin-macchiato"

[outputs]
  home = ["HTML", "JSON"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[params]
  enableIntegrity = false
  relatedPostsCount = 3
  description = """
  The most convenient screenshotting tool.
  Fullscreen, Window, Region, GIF
  at zero cost. Free, monitor- and DPI-aware.
  """
  author = "ABC-Valarus"
  heroTitleLine1 = "GCILib provides"
  heroTitleLine2 = "GCIScreenshot"
  footerText = ""

  [params.avatar]
    [params.avatar.home]
      assetPath = "images/GCIScreenshotDesktop.png"

    [params.avatar.about]
      assetPath = "images/GCIScreenshotDesktop.png"

  [params.buyMeACoffee]
    enabled = false
    id = "yourwidgetid"

  [params.codeHighlight]
    darkTheme = "catppuccin-macchiato"
    lightTheme = "catppuccin-frappe"

  [params.copyright]
    startYear = 2025
    owner = "ABC-Valarus"

  [params.admonitions]
    alertStyle = "favicon"

# Single language: use root-level menus. No [languages] block needed.
[[menus.main]]
  name = "Home"
  pageRef = "/"
  weight = 10


